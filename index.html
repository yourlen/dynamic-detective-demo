<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>问迹侦探社 - 移动规则原型</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5eef2;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      color: #443540;
    }
    .phone {
      width: min(390px, 100vw);
      height: 100dvh;
      max-height: 932px;
      background: #fff8f3;
      padding: 5px 7px 7px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }
    .hidden { display: none !important; }
    .loading-screen,
    .main-screen {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 8px 10px 18px;
      overflow: hidden;
    }
    .loading-panel,
    .main-panel {
      width: 100%;
      display: grid;
      gap: 14px;
      justify-items: center;
      text-align: center;
    }
    .loading-logo {
      width: 92px;
      height: 92px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ffd4df, #d7c4ff 52%, #bce7ff);
      color: #fff;
      font-size: 42px;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(149, 104, 174, .22);
    }
    .loading-title,
    .main-title {
      display: grid;
      gap: 5px;
    }
    .loading-title h1,
    .main-title h1 {
      margin: 0;
      font-size: 28px;
      color: #533548;
    }
    .loading-title p,
    .main-title p {
      margin: 0;
      color: #745867;
      font-size: 13px;
      font-weight: 700;
    }
    .loading-bar {
      width: min(220px, 78%);
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: #f3dfe8;
    }
    .loading-bar span {
      display: block;
      width: 48%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff9bad, #9dccf5);
      animation: loadingMove 1s ease-in-out infinite alternate;
    }
    @keyframes loadingMove {
      from { transform: translateX(-20%); }
      to { transform: translateX(128%); }
    }
    .difficulty-list {
      width: 100%;
      display: grid;
      gap: 10px;
    }
    .config-import {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px;
      border-radius: 10px;
      background: #fff;
      border: 1px dashed #d9b8ef;
      color: #745867;
      font-size: 12px;
      font-weight: 700;
    }
    .config-import button {
      min-width: 82px;
    }
    .config-status {
      min-width: 0;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .difficulty-card {
      min-height: 72px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      text-align: left;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid rgba(233, 119, 134, .22);
      box-shadow: 0 2px 0 rgba(231, 173, 181, .55);
    }
    .difficulty-card b {
      display: block;
      color: #d95e61;
      font-size: 18px;
      margin-bottom: 3px;
    }
    .difficulty-card span {
      color: #745867;
      font-size: 12px;
      font-weight: 700;
    }
    .difficulty-card em {
      font-style: normal;
      color: #fff;
      background: #e97786;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 900;
    }
    .difficulty-card:disabled {
      opacity: .52;
      filter: grayscale(.25);
      cursor: not-allowed;
    }
    .menu-screen {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      padding: 8px 8px 12px;
      overflow: hidden;
    }
    .menu-title {
      text-align: center;
      display: grid;
      gap: 5px;
    }
    .menu-title h1 { font-size: 24px; }
    .menu-title p {
      margin: 0;
      color: #745867;
      font-size: 12px;
      font-weight: 700;
    }
    .stamina-card {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      align-self: stretch;
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(191, 155, 115, .38);
      border-radius: 12px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.86), rgba(255,250,241,.74)),
        radial-gradient(circle at 18% 0%, rgba(255,255,255,.9), transparent 45%);
      padding: 6px 10px;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.45),
        0 2px 0 rgba(207, 172, 128, .35);
      color: #5a4933;
      position: relative;
      overflow: hidden;
    }
    .stamina-card::before,
    .stamina-card::after {
      content: "";
      position: absolute;
      top: 5px;
      width: 16px;
      height: 16px;
      border-top: 2px solid rgba(182, 148, 104, .38);
      pointer-events: none;
    }
    .stamina-card::before {
      left: 6px;
      border-left: 2px solid rgba(182, 148, 104, .38);
      border-radius: 8px 0 0 0;
    }
    .stamina-card::after {
      right: 6px;
      border-right: 2px solid rgba(182, 148, 104, .38);
      border-radius: 0 8px 0 0;
    }
    .stamina-icon { display: none; }
    .stamina-main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3px;
      min-width: 0;
    }
    .stamina-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 900;
    }
    .stamina-line > span:first-child {
      display: none;
    }
    .stamina-pips {
      display: flex;
      gap: 5px;
      min-width: 0;
      overflow: hidden;
    }
    .stamina-pip {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: #6f5534;
      font-size: 17px;
      line-height: 1;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,.75));
    }
    .stamina-pip.empty {
      opacity: .24;
      filter: grayscale(1);
    }
    .stamina-value {
      flex: 0 0 auto;
      min-width: 36px;
      text-align: right;
      color: #5a3d4f;
      font-size: 12px;
    }
    .stamina-next {
      justify-self: end;
      color: #8a7462;
      font-size: 9.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    .script-card:disabled {
      opacity: .52;
      filter: grayscale(.2);
      cursor: not-allowed;
    }
    .list-back {
      min-height: 28px;
      width: 100%;
    }
    .script-list {
      display: grid;
      gap: 12px;
      align-content: start;
      min-height: 0;
      overflow-y: auto;
      padding: 2px 4px 8px;
      scrollbar-width: thin;
    }
    .script-card {
      min-height: 68px;
      border: 1px solid rgba(233, 119, 134, .22);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 2px 0 rgba(231, 173, 181, .6);
      padding: 8px 10px;
      text-align: left;
      display: grid;
      gap: 6px;
    }
    .script-card b {
      color: #d95e61;
      font-size: 14px;
      line-height: 1.15;
    }
    .script-card span {
      color: #533548;
      font-size: 11px;
      line-height: 1.28;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .game-screen {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }
    h1 { margin: 0; text-align: center; font-size: 16px; line-height: 1.05; }
    .rule {
      margin: 0;
      padding: 5px 7px;
      border-radius: 8px;
      background: #fff;
      color: #6d5965;
      line-height: 1.24;
      font-size: 9.5px;
    }
    .rule b { color: #533548; }
    .rule .focus {
      display: block;
      color: #533548;
      font-weight: 800;
      margin-bottom: 2px;
    }
    .topbar {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .topbar > * { flex: 1 1 0; }
    .query-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 8px;
      align-items: center;
    }
    .points {
      background: #e97786;
      color: white;
      padding: 7px 7px;
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      font-size: 12px;
    }
    button, select {
      min-height: 29px;
      border: 0;
      border-radius: 8px;
      background: #ffd3d8;
      color: #443540;
      font-weight: 700;
      box-shadow: 0 2px 0 #e7adb5;
      font-size: 11px;
      padding: 0 6px;
    }
    select {
      padding: 0 8px;
      background: #fff;
      border: 1px solid #efd0d6;
      box-shadow: none;
    }
    button:active { transform: translateY(1px); box-shadow: 0 1px 0 #e7adb5; }
    .secondary { background: #ffe3a8; box-shadow: 0 2px 0 #ddbf74; }
    .attention {
      animation: attentionPulse .8s ease-in-out 5;
      box-shadow: 0 0 0 3px rgba(233, 119, 134, .22), 0 2px 0 #ddbf74;
    }
    @keyframes attentionPulse {
      0%, 100% { filter: brightness(1); transform: scale(1); }
      50% { filter: brightness(1.12); transform: scale(1.04); }
    }
    .panel-title {
      margin: 0 0 -3px;
      font-weight: 800;
      font-size: 12px;
      color: #533548;
    }
    .query {
      display: grid;
      gap: 8px;
      padding: 10px;
      border-radius: 8px;
      background: #fff;
    }
    .query-row { grid-template-columns: 82px 1fr 1fr; }
    .query-row label { font-size: 13px; font-weight: 800; color: #745867; }
    .query button { width: 100%; }
    .floor-bg { fill: #fff8ee; }
    .wall { fill: none; stroke: #1f1712; stroke-width: 2.4; stroke-linejoin: round; }
    .room-fill { fill: #f2f5fb; }
    .placeholder-fill { fill: #f2f5fb; }
    .door-cut { stroke: #f2f5fb; stroke-width: 8; stroke-linecap: square; }
    .map-label { fill: #d95e61; font-size: 22px; font-weight: 900; text-anchor: start; dominant-baseline: hanging; }
    .map-label-small { display: none; }
    .map-time { fill: #26232b; font-size: 20px; font-weight: 500; text-anchor: start; dominant-baseline: middle; }
    .map-placeholder { fill: #443540; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .magnifier { fill: none; stroke: #d95e61; stroke-width: 2; stroke-linecap: round; }
    .board-wrap {
      overflow-x: hidden;
      overflow-y: auto;
      border-radius: 8px;
      background: #fff;
      padding: 2px;
      flex: 1;
      min-height: 0;
    }
    .logic-board {
      display: grid;
      gap: 2px;
    }
    .time-map-row { display: block; }
    .time-label { display: none; }
    .logic-map {
      position: relative;
      aspect-ratio: 850 / 104;
      min-height: 38px;
      border-radius: 6px;
      overflow: hidden;
      background: #fffaf5;
      border: 1px solid #f1d7d7;
    }
    .logic-map svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .room-layer {
      position: absolute;
      cursor: pointer;
    }
    .room-layer.locked { background: transparent; }
    .mark-zone {
      position: absolute;
      left: 23%;
      right: 6%;
      top: 16%;
      bottom: 12%;
      border: 0;
      background: transparent;
      padding: 0;
      display: grid;
      align-content: center;
      pointer-events: none;
    }
    .tokens {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 2px;
      align-content: center;
      width: 100%;
      height: 100%;
      justify-items: center;
    }
    .token {
      width: min(8px, 92%);
      height: auto;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      margin: auto;
      font-size: 5px;
      line-height: 1;
      font-weight: 800;
    }
    .known-yes {
      background: #54b36c;
      color: #fff;
      border: 1px solid #54b36c;
    }
    .player-yes {
      background: transparent;
      color: #2d8442;
      border: 1px solid #54b36c;
    }
    .player-no {
      background: transparent;
      color: #c94e55;
      border: 1px solid #e87474;
    }
    .cell-unknown {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #7d6d76;
      font-size: 18px;
      font-weight: 900;
      border: 2px dashed #b8aab2;
      border-radius: 8px;
      background: rgba(255,255,255,.4);
    }
    .empty-token { opacity: .12; background: #bda9b3; color: transparent; }
    .log {
      display: none;
      min-height: 36px;
      max-height: 44px;
      overflow: auto;
      background: #fff;
      border-radius: 8px;
      padding: 8px;
      line-height: 1.35;
      color: #624b58;
      font-size: 11px;
    }
    .case-tools {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
    }
    .case-tools button {
      min-height: 27px;
      font-size: 10px;
      padding: 0 3px;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(55, 34, 48, .32);
      display: none;
      place-items: center;
      padding: 18px;
    }
    .modal {
      width: min(370px, 94vw);
      max-height: 86vh;
      overflow: auto;
      background: #fff;
      border-radius: 8px;
      padding: 18px;
      display: grid;
      gap: 10px;
    }
    .modal h2 { margin: 0; text-align: center; }
    .answer-row {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 8px;
      align-items: center;
    }
    .answer-row label { font-weight: 800; color: #745867; }
    .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .choices button { min-height: 42px; font-size: 12px; padding: 0 4px; }
    .mark-toggle {
      background: #f6f1fb;
      border: 1px solid #dacfed;
      box-shadow: 0 2px 0 #c9badc;
    }
    .mark-toggle.mark-yes {
      background: #e8f8ee;
      border-color: #68bd7d;
      color: #27904d;
      box-shadow: 0 2px 0 #8fd39d;
    }
    .mark-toggle.mark-no {
      background: #fff0f1;
      border-color: #e8717b;
      color: #c94a55;
      box-shadow: 0 2px 0 #e6a2a8;
    }
    .mark-toggle.mark-known {
      background: #e8f8ee;
      border-color: #52b86d;
      color: #288d4b;
      opacity: .85;
    }
    .mark-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .mark-actions button {
      min-height: 36px;
      font-size: 11px;
      padding: 0 4px;
    }
    .mark-actions .unknown-active {
      background: #f2e9ff;
      border: 1px solid #9b7bd9;
      color: #6b46b8;
      box-shadow: 0 2px 0 #bda7e6;
    }
    .history-item {
      padding: 8px;
      border-radius: 8px;
      background: #fff4f2;
      line-height: 1.45;
      font-size: 13px;
    }
    .scroll-list {
      max-height: 54vh;
      overflow: auto;
      display: grid;
      gap: 8px;
      padding-right: 2px;
    }
    .review-grid {
      max-height: 54vh;
      overflow: auto;
      display: grid;
      gap: 5px;
    }
    .route-review {
      max-height: 54vh;
      overflow: auto;
      display: grid;
      gap: 5px;
      padding-right: 2px;
    }
    .route-row {
      border-radius: 8px;
      border: 1px solid #efd0d6;
      background: #fffaf7;
      padding: 6px 8px;
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: center;
      gap: 6px;
    }
    .route-actor {
      color: #d95e61;
      font-size: 13px;
      font-weight: 900;
    }
    .route-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px;
      color: #533548;
      font-size: 12px;
      line-height: 1.2;
    }
    .route-step {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: transparent;
      border: 0;
      padding: 0 1px;
      white-space: nowrap;
      font-weight: 800;
    }
    .route-hit {
      background: #e6f7e9;
      border-color: #54b36c;
      color: #2d8442;
      font-weight: 900;
      padding: 1px 4px;
    }
    .route-arrow {
      color: #9a8792;
      font-weight: 900;
    }
    .review-room-layer {
      position: absolute;
      color: #533548;
      font-size: 10px;
      font-weight: 900;
    }
    .review-room-layer .mark-zone {
      color: #533548;
      display: block;
      line-height: 1.2;
    }
    .review-answer {
      border-color: #54b36c;
      background: rgba(225, 247, 229, .7);
      box-shadow: inset 0 0 0 2px #54b36c;
    }
    .result-title {
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      color: #533548;
    }
    .dev-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }
    .dev-grid b { color: #533548; }

    .phone {
      width: min(420px, 100vw);
      height: 100dvh;
      max-height: 100dvh;
      background:
        linear-gradient(180deg, rgba(208, 228, 255, .95), rgba(246, 249, 255, .98) 24%, rgba(226, 244, 255, .95));
      border: 2px solid #a9cdfa;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.75);
      padding: 7px;
      gap: 6px;
    }
    .game-screen { gap: 6px; }
    .menu-screen { padding: 12px 8px; }
    .menu-title { flex: 0 0 auto; }
    .script-list {
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .stage-hero {
      position: relative;
      flex: 0 0 auto;
      min-height: 102px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #d9b8ef;
      background:
        radial-gradient(circle at 8% 18%, rgba(255,255,255,.95) 0 2px, transparent 3px),
        radial-gradient(circle at 18% 44%, rgba(255,255,255,.85) 0 2px, transparent 3px),
        radial-gradient(circle at 42% 18%, rgba(255,255,255,.9) 0 3px, transparent 4px),
        linear-gradient(105deg, #d9b3ff 0%, #f6c9e8 45%, #ffe5a9 100%);
      box-shadow: 0 2px 0 rgba(169, 117, 205, .28);
    }
    .stage-hero::before,
    .stage-hero::after {
      content: "";
      position: absolute;
      border-radius: 50% 50% 46% 46%;
      background: linear-gradient(145deg, rgba(148,101,232,.9), rgba(255,119,174,.9));
      transform: rotate(-28deg);
      box-shadow: 16px 10px 0 -2px rgba(255,117,157,.78), 34px -2px 0 -9px rgba(255,255,255,.85);
    }
    .stage-hero::before {
      width: 28px;
      height: 24px;
      left: 18px;
      top: 18px;
    }
    .stage-hero::after {
      width: 16px;
      height: 14px;
      left: 44px;
      top: 38px;
      opacity: .9;
    }
    .stage-ribbon {
      position: absolute;
      left: 112px;
      right: 118px;
      top: 25px;
      min-height: 42px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      text-shadow: 0 1px 0 rgba(57,33,94,.45);
      background: linear-gradient(180deg, #9a6bea, #7650d1);
      border: 2px solid rgba(255,255,255,.7);
      border-radius: 5px;
      box-shadow: 0 3px 0 rgba(88,58,149,.45);
    }
    .stage-ribbon::before,
    .stage-ribbon::after {
      content: "";
      position: absolute;
      top: 6px;
      width: 34px;
      height: 30px;
      background: #7c56d4;
      z-index: -1;
    }
    .stage-ribbon::before {
      left: -24px;
      clip-path: polygon(0 0,100% 0,78% 50%,100% 100%,0 100%,20% 50%);
    }
    .stage-ribbon::after {
      right: -24px;
      clip-path: polygon(0 0,100% 0,80% 50%,100% 100%,0 100%,22% 50%);
    }
    .hero-meta {
      position: absolute;
      left: 18px;
      right: 154px;
      bottom: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .clock-pill,
    .progress-pill {
      min-width: 74px;
      height: 22px;
      display: inline-grid;
      place-items: center;
      padding: 0 10px;
      border-radius: 99px;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(153,93,128,.28);
      color: #66485c;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 1px 0 rgba(255,255,255,.8);
    }
    .detective-art {
      position: absolute;
      right: 12px;
      bottom: -4px;

    let caseSeed = Date.now();
    let allPathCache = null;
    let caseResolved = false;
    let staminaState = loadStaminaState();

    function stageTitle() {
      if (currentScriptId === 'theft') return '第 1 关 / 简单';
      if (currentScriptId === 'loner') return '第 2 关 / 简单';
      if (currentScriptId === 'companion') return '第 3 关 / 简单';
      if (currentScriptId === 'jewel') return '第 4 关 / 简单';
      if (currentScriptId === 'bomb') return '第 5 关 / 简单';
      if (currentScriptId === 'lovers') return '第 6 关 / 简单';
      return '第 7 关 / 简单';
    }

    function loadStaminaState() {
      try {
        const saved = JSON.parse(localStorage.getItem(staminaStorageKey) || 'null');
        if (saved && Number.isFinite(saved.value) && Number.isFinite(saved.updatedAt)) {
          return normalizeStaminaState(saved);
        }
      } catch (error) {}
      return { value: staminaMax, updatedAt: Date.now() };
    }

    function saveStaminaState() {
      localStorage.setItem(staminaStorageKey, JSON.stringify(staminaState));
    }

    function normalizeStaminaState(state) {
      const now = Date.now();
      let value = Math.max(0, Math.min(staminaMax, Math.floor(state.value)));
      let updatedAt = Math.min(now, Math.max(0, state.updatedAt));
      if (value < staminaMax) {
        const recovered = Math.floor((now - updatedAt) / staminaRecoverMs);
        if (recovered > 0) {
          value = Math.min(staminaMax, value + recovered);
          updatedAt += recovered * staminaRecoverMs;
        }
      }
      if (value >= staminaMax) updatedAt = now;
      return { value, updatedAt };
    }

    function refreshStamina() {
      staminaState = normalizeStaminaState(staminaState);
      saveStaminaState();
      renderStamina();
    }

    function renderStamina() {
      const valueEl = document.getElementById('staminaValue');
      const nextEl = document.getElementById('staminaNext');
      const pipsEl = document.getElementById('staminaPips');
      if (!valueEl || !nextEl) return;
      valueEl.textContent = `${staminaState.value}/${staminaMax}`;
      valueEl.classList.add('stamina-value');
      if (pipsEl) {
        pipsEl.innerHTML = Array.from({ length: staminaMax }, (_, index) => {
          const empty = index >= staminaState.value ? ' empty' : '';
          return `<span class="stamina-pip${empty}">🔎</span>`;
        }).join('');
      }
      if (staminaState.value >= staminaMax) {
        nextEl.textContent = '体力已满';
      } else {
        const remain = Math.max(0, staminaRecoverMs - (Date.now() - staminaState.updatedAt));
        const minutes = Math.floor(remain / 60000);
        const seconds = Math.floor((remain % 60000) / 1000).toString().padStart(2, '0');
        nextEl.textContent = `下 1 点恢复：${minutes}:${seconds}`;
      }
      document.querySelectorAll('[data-script], [data-difficulty]').forEach(button => {
        button.disabled = staminaState.value <= 0;
      });
    }

    function setConfigStatus(text, isError = false) {
      const el = document.getElementById('configStatus');
      if (!el) return;
      el.textContent = text;
      el.style.color = isError ? '#c94a55' : '#745867';
    }

    function parseLevelConfigText(text, fileName = '') {
      if (fileName.toLowerCase().endsWith('.json') || text.trim().startsWith('{')) {
        return normalizeImportedConfig(JSON.parse(text));
      }
      return parseLevelConfigCsv(text);
    }

    async function parseImportedConfigFile(file) {
      const bytes = await file.arrayBuffer();
      const encodings = ['utf-8', 'gb18030', 'gbk'];
      let firstError = null;
      for (const encoding of encodings) {
        try {
          const decoder = new TextDecoder(encoding);
          return parseLevelConfigText(decoder.decode(bytes), file.name);
        } catch (error) {
          firstError ??= error;
        }
      }
      throw firstError;
    }

    async function loadAutoLevelConfig() {
      const configUrl = 'level-config-template.csv';
      try {
        const bytes = await readConfigBytes(configUrl);
        const encodings = ['utf-8', 'gb18030', 'gbk'];
        let firstError = null;
        for (const encoding of encodings) {
          try {
            const text = new TextDecoder(encoding).decode(bytes);
            registerImportedConfig(parseLevelConfigText(text, configUrl));
            return true;
          } catch (error) {
            firstError ??= error;
          }
        }
        throw firstError;
      } catch (error) {
        importedConfigMode = false;
        setConfigStatus(`未读取到配置表，使用内置关卡`);
        return false;
      }
    }

    async function readConfigBytes(url) {
      try {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.arrayBuffer();
      } catch (fetchError) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('GET', `${url}?t=${Date.now()}`, true);
          xhr.responseType = 'arraybuffer';
          xhr.onload = () => {
            if (xhr.status === 0 || (xhr.status >= 200 && xhr.status < 300)) resolve(xhr.response);
            else reject(new Error(`HTTP ${xhr.status}`));
          };
          xhr.onerror = () => reject(fetchError);
          xhr.send();
        });
      }
    }

    function normalizeCsvHeader(cell) {
      return String(cell ?? '').replace(/^\uFEFF/, '').trim();
    }

    function parseLevelConfigCsv(text) {
      const rows = parseCsvRows(text).filter(row => row.some(cell => String(cell).trim()));
      if (rows.length < 2) throw new Error('CSV 至少需要表头和一行数据。');
      const headers = rows[0].map(normalizeCsvHeader);
      if (headers.includes('id') && headers.includes('关卡名称')) {
        return parseWideLevelConfigRows(headers, rows.slice(1));
      }
      const required = ['section', 'levelId'];
      required.forEach(name => {
        if (!headers.includes(name)) throw new Error(`CSV 缺少列：${name}`);
      });
      const get = (row, name) => String(row[headers.indexOf(name)] ?? '').trim();
      const setting = {
        id: '',
        source: 'config',
        title: '',
        initial: null,
        initialKnown: {},
        pathAnchors: {},
        questions: 18,
        known: 6,
        task: '',
        conditionType: '',
        conditionParams: {}
      };
      rows.slice(1).forEach(row => {
        const section = get(row, 'section');
        const levelId = get(row, 'levelId');
        const field = get(row, 'field');
        const actor = get(row, 'actor');
        const time = get(row, 'time');
        const place = get(row, 'place');
        const value = get(row, 'value');
        if (!levelId) return;
        setting.id ||= levelId;
        if (levelId !== setting.id) throw new Error('一次只能导入一个 levelId。');
        if (section === 'Level') {
          if (field === 'title') setting.title = value;
          if (field === 'questions') setting.questions = Number(value);
          if (field === 'known') setting.known = Number(value);
          if (field === 'task') setting.task = value;
          if (field === 'conditionType') setting.conditionType = value;
        } else if (section === 'Param') {
          setting.conditionParams[field] = value;
        } else if (section === 'Known') {
          setting.initialKnown[actor] = place;
          setting.pathAnchors[actor] ??= {};
          setting.pathAnchors[actor][0] = place;
        } else if (section === 'Path') {
          const timeIndex = parseTimeIndex(time);
          setting.pathAnchors[actor] ??= {};
          setting.pathAnchors[actor][timeIndex] = place;
        }
      });
      if (!setting.task) setting.task = `<span class="focus">简介：${setting.title}</span><span class="focus">请根据配置目标完成推理。</span><b>重要：</b>每个时间点，每个角色必须移动到相邻地点。`;
      if (!Object.keys(setting.initialKnown).length) {
        Object.entries(setting.pathAnchors).forEach(([actorId, anchors]) => {
          if (anchors[0]) setting.initialKnown[actorId] = anchors[0];
        });
      }
      return setting;
    }

    function parseWideLevelConfigRows(headers, dataRows) {
      const required = ['id', '关卡名称', '关卡难度', '关卡描述', '关卡谜题类型', '谜题参数', '关卡房间数', '房间链接关系', '角色数和性别关系', '时间点数'];
      required.forEach(name => {
        if (!headers.includes(name)) throw new Error(`CSV 缺少列：${name}`);
      });
      const ids = new Set();
      const parsed = dataRows
        .filter(row => row.some(cell => String(cell).trim()))
        .map(row => parseWideLevelRow(headers, row));
      if (!parsed.length) throw new Error('没有可导入的关卡行。');
      parsed.forEach(setting => {
        if (ids.has(setting.id)) throw new Error(`id 重复：${setting.id}`);
        ids.add(setting.id);
      });
      return parsed;
    }

    function parseWideLevelRow(headers, row) {
      const get = name => String(row[headers.indexOf(name)] ?? '').trim();
      const id = get('id');
      const title = get('关卡名称');
      const difficulty = get('关卡难度') || 'easy';
      const description = get('关卡描述');
      const conditionType = get('关卡谜题类型');
      const conditionParams = parseConfigArray(get('谜题参数'), '谜题参数');
      const roomCount = Number(get('关卡房间数'));
      const roomLinks = parseRoomLinks(get('房间链接关系'));
      const roleDefs = parseRoleDefs(get('角色数和性别关系'));
      const timeCount = Number(get('时间点数'));
      if (!Number.isInteger(timeCount) || timeCount < 1) throw new Error(`${id || '未命名关卡'} 的时间点数非法。`);
      const timeColumns = headers.slice(10, 10 + timeCount);
      if (timeColumns.length < timeCount) throw new Error(`${id || '未命名关卡'} 的时间列数量不足。`);
      const pathAnchors = {};
      const initialKnown = {};
      const actorIds = roleDefs.map(actor => actor.id);
      timeColumns.forEach((columnName, timeIndex) => {
        const raw = get(columnName);
        const positions = parseConfigArray(raw || '[]', `${columnName}`);
        if (positions.length === 0) return;
        if (positions.length !== actorIds.length) {
          throw new Error(`${id} 的 ${columnName} 位置数组长度应为 ${actorIds.length}，实际为 ${positions.length}。`);
        }
        positions.forEach((place, actorIndex) => {
          if (place === null || place === undefined || String(place).trim() === '') return;
          const actorId = actorIds[actorIndex];
          pathAnchors[actorId] ??= {};
          pathAnchors[actorId][timeIndex] = place;
          if (timeIndex === 0) initialKnown[actorId] = place;
        });
      });
      const params = paramsArrayToObject(conditionParams);
      const visibleInitialActors = Array.isArray(params.visibleInitialActors)
        ? params.visibleInitialActors
        : Array.isArray(params.初始可见角色)
          ? params.初始可见角色
          : null;
      if (visibleInitialActors) {
        Object.keys(initialKnown).forEach(actorId => {
          if (!visibleInitialActors.includes(actorId)) delete initialKnown[actorId];
        });
      }
      const setting = {
        id,
        title,
        difficulty,
        description,
        source: 'config',
        initial: null,
        initialKnown,
        pathAnchors,
        questions: Number(params.questions || params.询问次数 || 18),
        known: Object.keys(initialKnown).length || 0,
        task: `<span class="focus">简介：${description || title}</span><span class="focus">请找出：${params.goal || params.目标 || '谜题答案'}。</span><b>重要：</b>每个时间点，每个角色必须移动到相邻地点。`,
        conditionType,
        conditionParams: params,
        roomCount,
        roomLinks,
        roleDefs,
        timeCount
      };
      return setting;
    }

    function parseConfigArray(raw, label) {
      const text = String(raw ?? '').trim();
      if (!text || text === '[]') return [];
      try {
        const parsed = JSON.parse(text);
        if (!Array.isArray(parsed)) throw new Error();
        return parsed;
      } catch (error) {
        throw new Error(`${label} 必须是数组，例如 ["N1","N2"] 或 [["targetActor","C"]]。`);
      }
    }

    function paramsArrayToObject(items) {
      const params = {};
      items.forEach((item, index) => {
        if (Array.isArray(item) && item.length >= 2) {
          params[item[0]] = item[1];
        } else if (typeof item === 'object' && item) {
          Object.assign(params, item);
        } else {
          params[`param${index + 1}`] = item;
        }
      });
      return params;
    }

    function parseRoomLinks(raw) {
      const entries = parseConfigArray(raw, '房间链接关系');
      const map = {};
      entries.forEach(entry => {
        if (!Array.isArray(entry) || entry.length < 2 || !Array.isArray(entry[1])) {
          throw new Error('房间链接关系格式应为 [["N1",["N2","N4"]], ...]。');
        }
        map[entry[0]] = entry[1];
      });
      return map;
    }

    function parseRoleDefs(raw) {
      const entries = parseConfigArray(raw, '角色数和性别关系');
      return entries.map(entry => {
        if (!Array.isArray(entry) || entry.length < 2) {
          throw new Error('角色数和性别关系格式应为 [["A","男"],["B","男"]]。');
        }
        return { id: entry[0], gender: entry[1] };
      });
    }

    function parseCsvRows(text) {
      const rows = [];
      let row = [];
      let cell = '';
      let quoted = false;
      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];
        if (quoted) {
          if (char === '"' && next === '"') {
            cell += '"';
            i += 1;
          } else if (char === '"') {
            quoted = false;
          } else {
            cell += char;
          }
        } else if (char === '"') {
          quoted = true;
        } else if (char === ',') {
          row.push(cell);
          cell = '';
        } else if (char === '\n') {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = '';
        } else if (char !== '\r') {
          cell += char;
        }
      }
      row.push(cell);
      rows.push(row);
      return rows;
    }

    function parseTimeIndex(time) {
      if (/^\d+$/.test(time)) return Number(time);
      const index = times.indexOf(time);
      if (index >= 0) return index;
      throw new Error(`非法时间点：${time}`);
    }

    function normalizeImportedConfig(raw) {
      return {
        id: raw.id || raw.levelId,
        source: 'config',
        title: raw.title,
        initial: null,
        initialKnown: raw.initialKnown || {},
        pathAnchors: raw.pathAnchors || {},
        questions: Number(raw.questions || 18),
        known: Number(raw.known || 6),
        task: raw.task || `<span class="focus">简介：${raw.title || '导入关卡'}</span><span class="focus">请根据配置目标完成推理。</span><b>重要：</b>每个时间点，每个角色必须移动到相邻地点。`,
        conditionType: raw.conditionType,
        conditionParams: raw.conditionParams || {}
      };
    }

    function registerImportedConfig(settingOrList) {
      const settings = Array.isArray(settingOrList) ? settingOrList : [settingOrList];
      settings.forEach(setting => {
        const errors = validateConfiguredSetting(setting);
        if (errors.length) throw new Error(`${setting.id || '未命名关卡'}：${errors.join(' ')}`);
      });
      customScriptIds.forEach(id => delete scriptSettings[id]);
      customScriptIds.length = 0;
      importedConfigMode = true;
      settings.forEach(setting => {
        const id = `custom_${setting.id}`;
        scriptSettings[id] = { ...setting, id, title: setting.title || '导入关卡' };
        if (!customScriptIds.includes(id)) customScriptIds.push(id);
      });
      updateDifficultyCounts();
      renderCustomScriptCards();
      setConfigStatus(`已导入 ${settings.length} 关`);
      showDifficultyList();
    }

    function renderCustomScriptCards() {
      const list = document.getElementById('scriptList');
      if (importedConfigMode) list.innerHTML = '';
      else document.querySelectorAll('[data-custom-script]').forEach(el => el.remove());
      const visibleIds = importedConfigMode
        ? customScriptIds.filter(id => normalizeDifficulty(scriptSettings[id].difficulty) === activeDifficulty)
        : customScriptIds;
      visibleIds.forEach((id, index) => {
        const setting = scriptSettings[id];
        const button = document.createElement('button');
        button.className = 'script-card';
        button.dataset.script = id;
        button.dataset.customScript = 'true';
        button.innerHTML = `<b>${formatScriptTitle(index, setting)}</b><span>${configCardSummary(setting)}</span>`;
        button.onclick = () => enterScript(id);
        list.appendChild(button);
      });
      renderStamina();
    }

    function formatScriptTitle(index, setting) {
      const title = String(setting.title || '导入关卡').replace(/^\d{3}\s*/, '');
      return `${index + 1}. ${title}`;
    }

    function normalizeDifficulty(value) {
      if (value === 'normal' || value === '普通') return 'medium';
      if (value === '困难') return 'hard';
      if (value === '简单') return 'easy';
      return value || 'easy';
    }

    function updateDifficultyCounts() {
      const labels = { easy: '简单', medium: '普通', hard: '困难' };
      ['easy', 'medium', 'hard'].forEach(level => {
        const el = document.getElementById(`${level}Count`);
        if (!el) return;
        const count = customScriptIds.filter(id => normalizeDifficulty(scriptSettings[id].difficulty) === level).length;
        el.textContent = importedConfigMode ? `${count} 关` : '开放';
      });
    }

    function configCardSummary(setting) {
      return setting.description || stripHtml(setting.task) || '导入关卡';
    }

    function stripHtml(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      return div.textContent || '';
    }

    function spendStaminaOnFailure() {
      refreshStamina();
      if (staminaState.value <= 0) return false;
      staminaState.value -= 1;
      staminaState.updatedAt = Date.now();
      saveStaminaState();
      renderStamina();
      return true;
    }

    function showMainScreen() {
      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('globalStamina').classList.remove('hidden');
      document.getElementById('mainScreen').classList.remove('hidden');
      document.getElementById('menuScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.add('hidden');
      refreshStamina();
    }

    function showDifficultyList(difficulty = activeDifficulty) {
      activeDifficulty = normalizeDifficulty(difficulty);
      if (!importedConfigMode) activeDifficulty = 'easy';
      renderCustomScriptCards();
      const labels = { easy: '简单', medium: '普通', hard: '困难' };
      const subtitle = document.getElementById('menuSubtitle');
      if (subtitle) subtitle.textContent = `${labels[activeDifficulty] || '简单'}难度 / 选择剧本`;
      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('globalStamina').classList.remove('hidden');
      document.getElementById('mainScreen').classList.add('hidden');
      document.getElementById('menuScreen').classList.remove('hidden');
      document.getElementById('gameScreen').classList.add('hidden');
      refreshStamina();
    }

    function enterScript(scriptId) {
      refreshStamina();
      if (staminaState.value <= 0) return;
      currentScriptId = scriptId;
      fixedInitial = scriptSettings[scriptId].initial;
      maxQuestions = scriptSettings[scriptId].questions;
      knownInitialCount = scriptSettings[scriptId].known;
      allPathCache = null;
      document.getElementById('mainScreen').classList.add('hidden');
      document.getElementById('menuScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('caseTitle').textContent = stageTitle();
      caseSeed = Date.now();
      startRound();
    }

    function rng(seed) {
      let value = Math.max(1, Math.abs(seed) % 2147483647);
      return () => {
        value = value * 16807 % 2147483647;
        return (value - 1) / 2147483646;
      };
    }

    function startRound() {
      const roundSeed = caseSeed++;
      const generated = generateCase(maxQuestions, roundSeed);
      paths = generated.paths;
      solution = generated.solution;
      difficulty = generated.difficulty;
      initialKnown = generated.initialKnown ?? pickInitialKnown(generated.paths, knownInitialCount, rng(roundSeed + 404));
      confirmed = {};
      manual = {};
      unknownCells = new Set();
      history = [];
      askedActorTimes = {};
      questionLeft = maxQuestions;
      caseResolved = false;
      Object.entries(initialKnown).forEach(([actorId, place]) => {
        setKnown(actorId, 0, place, '开局信息');
      });
      renderStatic();
      render();
      pushLog('询问结果会自动保存到记录面板。');
    }

    function generateCase(questionBudget, seed) {
      if (scriptSettings[currentScriptId]?.source === 'config') return generateConfiguredCase(scriptSettings[currentScriptId], seed);
      if (currentScriptId === 'theft') return generateTheftCase(questionBudget, seed);
      if (currentScriptId === 'companion') return generateCompanionCase(questionBudget, seed);
      if (currentScriptId === 'jewel') return generateJewelCase(questionBudget, seed);
      if (currentScriptId === 'bomb') return generateBombCase(questionBudget, seed);
      if (currentScriptId === 'lovers') return generateLoversCase(questionBudget, seed);
      if (currentScriptId === 'vandal') return generateVandalCase(questionBudget, seed);
      return generateLonerCase(questionBudget, seed);
    }

    function generateConfiguredCase(setting, seed) {
      const random = rng(seed);
      for (let attempt = 0; attempt < 12000; attempt += 1) {
        const generatedPaths = buildConfiguredPaths(setting, random);
        const solutionResult = solveConfiguredCondition(setting, generatedPaths, random);
        if (solutionResult && hasEnoughEliminationSpace(setting, solutionResult)) {
          return {
            paths: clonePaths(generatedPaths),
            solution: solutionResult,
            difficulty: expectedAlwaysAloneQuestions(),
            initialKnown: setting.initialKnown
          };
        }
      }
      const fallbackPaths = buildConfiguredPaths(setting, rng(seed + 777));
      const fallbackSolution = solveConfiguredCondition(setting, fallbackPaths, rng(seed + 888));
      if (!fallbackSolution) {
        return fallbackConfiguredCase(setting, seed + 999);
      }
      if (!hasEnoughEliminationSpace(setting, fallbackSolution)) {
        return fallbackConfiguredCase(setting, seed + 999);
      }
      return {
        paths: fallbackPaths,
        solution: fallbackSolution,
        difficulty: expectedAlwaysAloneQuestions(),
        initialKnown: setting.initialKnown
      };
    }

    function fallbackConfiguredCase(setting, seed) {
      const type = setting.conditionType;
      const fallback = type === 'theft' ? fallbackTheftCase()
        : type === 'alwaysTogether' ? fallbackCompanionCase()
        : type === 'jewelTransfer' ? fallbackJewelCase()
        : type === 'bomb' ? fallbackBombCase()
        : type === 'neverMeetPair' ? fallbackLoversCase()
        : type === 'visitCount' ? fallbackVandalCase()
        : fallbackCase();
      const visibleActors = setting.conditionParams?.visibleInitialActors;
      const knownCount = Array.isArray(visibleActors)
        ? visibleActors.length
        : Math.max(1, Object.keys(setting.initialKnown || {}).length || Number(setting.known || 6));
      const generatedInitialKnown = Array.isArray(visibleActors)
        ? Object.fromEntries(visibleActors.map(actorId => [actorId, fallback.paths[actorId]?.[0]]).filter(item => item[1]))
        : pickInitialKnown(fallback.paths, Math.min(actors.length, knownCount), rng(seed));
      return {
        paths: clonePaths(fallback.paths),
        solution: fallback.solution,
        difficulty: fallback.difficulty,
        initialKnown: generatedInitialKnown
      };
    }

    function buildConfiguredPaths(setting, random) {
      const generatedPaths = {};
      actors.forEach(actor => {
        const anchors = setting.pathAnchors?.[actor.id] ?? {};
        const startPool = anchors[0] ? [anchors[0]] : places;
        let candidates = [];
        startPool.forEach(startPlace => {
          candidates = candidates.concat(buildPathsFrom(startPlace, times.length));
        });
        candidates = candidates.filter(path => {
          return Object.entries(anchors).every(([timeIndex, place]) => path[Number(timeIndex)] === place);
        });
        if (!candidates.length) {
          candidates = buildPathsFrom(pick(startPool, random), times.length);
        }
        generatedPaths[actor.id] = pick(candidates, random);
      });
      return generatedPaths;
    }

    function solveConfiguredCondition(setting, generatedPaths, random = Math.random) {
      const type = setting.conditionType;
      const params = setting.conditionParams ?? {};
      if (type === 'theft') {
        const events = findTheftEventsFor(generatedPaths, params.targetActor || 'C');
        return pickUniqueOrNull(events);
      }
      if (type === 'alwaysAlone') {
        const candidates = actors.map(actor => actor.id).filter(actorId => isAlwaysAlone(generatedPaths, actorId));
        return candidates.length === 1 ? { actor: candidates[0] } : null;
      }
      if (type === 'alwaysTogether') {
        const candidates = actors.map(actor => actor.id).filter(actorId => isAlwaysWithSomeone(generatedPaths, actorId));
        return candidates.length === 1 ? { actor: candidates[0] } : null;
      }
      if (type === 'jewelTransfer') {
        const jewelRoom = params.jewelRoom || pick(places.filter(place => actors.every(actor => generatedPaths[actor.id][0] !== place)), random);
        return simulateJewel(generatedPaths, jewelRoom);
      }
      if (type === 'bomb') {
        return pickUniqueOrNull(findBombEvents(generatedPaths));
      }
      if (type === 'neverMeetPair') {
        return pickUniqueOrNull(findNeverMeetPairs(generatedPaths));
      }
      if (type === 'visitCount') {
        const uniqueCount = Number(params.uniqueCount || 5);
        const repeatedCount = Number(params.repeatedCount || 2);
        const matches = actors
          .map(actor => ({ actor: actor.id, detail: getVisitDetail(generatedPaths[actor.id], uniqueCount, repeatedCount) }))
          .filter(item => item.detail);
        return matches.length === 1 ? { actor: matches[0].actor, ...matches[0].detail } : null;
      }
      return null;
    }

    function pickUniqueOrNull(items) {
      return items.length === 1 ? items[0] : null;
    }

    function findTheftEventsFor(generatedPaths, targetActor) {
      const events = [];
      times.forEach((time, timeIndex) => {
        const targetPlace = generatedPaths[targetActor]?.[timeIndex];
        if (!targetPlace) return;
        const here = actors.map(actor => actor.id).filter(actorId => generatedPaths[actorId][timeIndex] === targetPlace);
        if (here.length === 2) {
          const actor = here.find(actorId => actorId !== targetActor);
          if (actor) events.push({ actor, place: targetPlace, timeIndex });
        }
      });
      return events;
    }

    function getVisitDetail(path, uniqueCount, repeatedCount) {
      const uniquePlaces = new Set(path);
      if (uniquePlaces.size !== uniqueCount) return null;
      const repeated = places
        .map(place => ({ place, indexes: path.map((p, index) => p === place ? index : -1).filter(index => index >= 0) }))
        .filter(item => item.indexes.length === repeatedCount);
      if (repeated.length !== 1) return null;
      return { place: repeated[0].place, timeIndex: repeated[0].indexes[repeatedCount - 1] };
    }

    function validateConfiguredSetting(setting) {
      const errors = [];
      const allowedConditions = ['theft', 'alwaysAlone', 'alwaysTogether', 'jewelTransfer', 'bomb', 'neverMeetPair', 'visitCount'];
      if (!setting.id) errors.push('缺少 levelId。');
      if (!setting.title) errors.push('缺少 title。');
      if (!allowedConditions.includes(setting.conditionType)) {
        errors.push(`不支持的 conditionType：${setting.conditionType || '空'}。`);
      }
      if (!Number.isFinite(setting.questions) || setting.questions <= 0) errors.push('questions 必须是正整数。');
      if (setting.roomCount !== undefined) {
        if (!Number.isInteger(setting.roomCount) || setting.roomCount < 1) errors.push('关卡房间数必须是正整数。');
        if (setting.roomCount !== places.length) errors.push(`当前原型暂时只支持 ${places.length} 个房间，配置为 ${setting.roomCount}。`);
      }
      if (setting.timeCount !== undefined && setting.timeCount !== times.length) {
        errors.push(`当前原型暂时只支持 ${times.length} 个时间点，配置为 ${setting.timeCount}。`);
      }
      if (setting.roleDefs) {
        if (setting.roleDefs.length !== actors.length) errors.push(`当前原型暂时只支持 ${actors.length} 个角色，配置为 ${setting.roleDefs.length}。`);
        const seenActors = new Set();
        setting.roleDefs.forEach(actor => {
          if (!actor.id) errors.push('角色配置存在空 id。');
          if (seenActors.has(actor.id)) errors.push(`角色 id 重复：${actor.id}。`);
          seenActors.add(actor.id);
          if (!['男', '女'].includes(actor.gender)) errors.push(`${actor.id} 的性别必须是 男 或 女。`);
          if (!actors.some(baseActor => baseActor.id === actor.id)) errors.push(`当前原型未知角色：${actor.id}。`);
        });
      }
      if (setting.roomLinks) {
        Object.entries(setting.roomLinks).forEach(([room, nextRooms]) => {
          if (!places.includes(room)) errors.push(`房间链接里有非法房间：${room}。`);
          if (!Array.isArray(nextRooms)) errors.push(`${room} 的链接目标必须是数组。`);
          nextRooms.forEach(nextRoom => {
            if (!places.includes(nextRoom)) errors.push(`${room} 链接了非法房间：${nextRoom}。`);
            if (!setting.roomLinks[nextRoom]?.includes(room)) errors.push(`房间链接必须双向：${room} -> ${nextRoom} 缺少反向。`);
          });
        });
      }
      const linkMap = setting.roomLinks || links;
      Object.entries(setting.pathAnchors ?? {}).forEach(([actorId, anchors]) => {
        if (!actors.some(actor => actor.id === actorId)) errors.push(`未知角色：${actorId}。`);
        Object.entries(anchors).forEach(([timeIndex, place]) => {
          const index = Number(timeIndex);
          if (!Number.isInteger(index) || index < 0 || index >= times.length) errors.push(`${actorId} 使用了非法时间点：${timeIndex}。`);
          if (!places.includes(place)) errors.push(`${actorId} 在 ${times[index] ?? timeIndex} 使用了非法地点：${place}。`);
        });
        const sorted = Object.entries(anchors)
          .map(([timeIndex, place]) => [Number(timeIndex), place])
          .sort((a, b) => a[0] - b[0]);
        for (let i = 1; i < sorted.length; i += 1) {
          const [prevTime, prevPlace] = sorted[i - 1];
          const [nextTime, nextPlace] = sorted[i];
          if (nextTime === prevTime + 1 && !linkMap[prevPlace]?.includes(nextPlace)) {
            errors.push(`${actorId} 的路径不符合连接规则：${times[prevTime]} ${prevPlace} -> ${times[nextTime]} ${nextPlace}。`);
          }
        }
      });
      Object.entries(setting.initialKnown ?? {}).forEach(([actorId, place]) => {
        if (!actors.some(actor => actor.id === actorId)) errors.push(`开局已知使用了未知角色：${actorId}。`);
        if (!places.includes(place)) errors.push(`开局已知 ${actorId} 使用了非法地点：${place}。`);
      });
      if (setting.conditionType === 'theft') {
        const target = setting.conditionParams?.targetActor || 'C';
        if (!actors.some(actor => actor.id === target)) errors.push(`theft.targetActor 不存在：${target}。`);
      }
      if (setting.conditionType === 'jewelTransfer') {
        const jewelRoom = setting.conditionParams?.jewelRoom;
        if (jewelRoom && !places.includes(jewelRoom)) errors.push(`jewelRoom 非法：${jewelRoom}。`);
      }
      if (setting.conditionType === 'visitCount') {
        const uniqueCount = Number(setting.conditionParams?.uniqueCount || 5);
        const repeatedCount = Number(setting.conditionParams?.repeatedCount || 2);
        if (!Number.isInteger(uniqueCount) || uniqueCount < 1 || uniqueCount > places.length) errors.push('visitCount.uniqueCount 非法。');
        if (!Number.isInteger(repeatedCount) || repeatedCount < 2 || repeatedCount > times.length) errors.push('visitCount.repeatedCount 非法。');
      }
      return errors;
    }

    function generateLonerCase(questionBudget, seed) {
      const random = rng(seed);
      const pathPool = getAllPathPool();

      for (let attempt = 0; attempt < 12000; attempt += 1) {
        const generatedPaths = {};
        actors.forEach(actor => {
          generatedPaths[actor.id] = pick(pathPool[actor.id], random);
        });
        const loners = actors
          .map(actor => actor.id)
          .filter(actorId => isAlwaysAlone(generatedPaths, actorId));

        if (loners.length === 1 && hasEnoughDistractors('loner', generatedPaths, { actor: loners[0] })) {
          return {
            paths: clonePaths(generatedPaths),
            solution: { actor: loners[0] },
            difficulty: expectedAlwaysAloneQuestions()
          };
        }
      }

      return fallbackCase();
    }

    function generateCompanionCase(questionBudget, seed) {
      const random = rng(seed);
      const pathPool = getAllPathPool();

      for (let attempt = 0; attempt < 12000; attempt += 1) {
        const generatedPaths = {};
        actors.forEach(actor => {
          generatedPaths[actor.id] = pick(pathPool[actor.id], random);
        });
        const companions = actors
          .map(actor => actor.id)
          .filter(actorId => isAlwaysWithSomeone(generatedPaths, actorId));

        if (companions.length === 1 && hasEnoughDistractors('companion', generatedPaths, { actor: companions[0] })) {
          return {
            paths: clonePaths(generatedPaths),
            solution: { actor: companions[0] },
            difficulty: expectedAlwaysAloneQuestions()
          };
        }
      }

      return fallbackCompanionCase();
    }

    function generateJewelCase(questionBudget, seed) {
      const random = rng(seed);

      for (let attempt = 0; attempt < 16000; attempt += 1) {
        const jewelRoom = pick(places, random);
        const generatedPaths = {};
        actors.forEach(actor => {
          const startPlace = pick(places.filter(place => place !== jewelRoom), random);
          const pool = buildPathsFrom(startPlace, times.length);
          generatedPaths[actor.id] = pick(pool, random);
        });
        const jewelResult = simulateJewel(generatedPaths, jewelRoom);
        if (jewelResult && hasEnoughDistractors('jewel', generatedPaths, jewelResult)) {
          return {
            paths: clonePaths(generatedPaths),
            solution: jewelResult,
            difficulty: expectedAlwaysAloneQuestions()
          };
        }
      }

      return fallbackJewelCase();
    }

    function simulateJewel(generatedPaths, jewelRoom) {
      let holder = null;
      let pickupTimeIndex = -1;
      let pickupActor = null;
      const transfers = [];

      for (let timeIndex = 1; timeIndex < times.length; timeIndex += 1) {
        const entrants = actors
          .map(actor => actor.id)
          .filter(actorId => generatedPaths[actorId][timeIndex] === jewelRoom);
        if (entrants.length === 0) continue;
        if (entrants.length > 1) return null;
        holder = entrants[0];
        pickupActor = holder;
        pickupTimeIndex = timeIndex;
        break;
      }

      if (!holder) return null;

      for (let timeIndex = pickupTimeIndex + 1; timeIndex < times.length; timeIndex += 1) {
        const place = generatedPaths[holder][timeIndex];
        const here = actors
          .map(actor => actor.id)
          .filter(actorId => generatedPaths[actorId][timeIndex] === place);
        if (here.length === 2) {
          const nextHolder = here.find(actorId => actorId !== holder);
          transfers.push({ from: holder, to: nextHolder, place, timeIndex });
          holder = nextHolder;
        }
      }

      return {
        actor: holder,
        place: generatedPaths[holder][times.length - 1],
        jewelRoom,
        pickupActor,
        pickupTimeIndex,
        transfers
      };
    }

    function generateTheftCase(questionBudget, seed) {
      const random = rng(seed);
      const pathPool = getAllPathPool();

      for (let attempt = 0; attempt < 12000; attempt += 1) {
        const generatedPaths = {};
        actors.forEach(actor => {
          generatedPaths[actor.id] = pick(pathPool[actor.id], random);
        });
        const events = findTheftEvents(generatedPaths);
        if (events.length === 1 && hasEnoughDistractors('theft', generatedPaths, events[0])) {
          return {
            paths: clonePaths(generatedPaths),
            solution: events[0],
            difficulty: expectedTheftQuestions()
          };
        }
      }

      return fallbackTheftCase();
    }

    function generateBombCase(questionBudget, seed) {
      const random = rng(seed);
      for (let attempt = 0; attempt < 20000; attempt += 1) {
        const generatedPaths = buildRandomActorPaths(random);
        const events = findBombEvents(generatedPaths);
        if (events.length === 1 && hasEnoughDistractors('bomb', generatedPaths, events[0])) {
          return {
            paths: clonePaths(generatedPaths),
            solution: events[0],
            difficulty: expectedAlwaysAloneQuestions()
          };
        }
      }
      return fallbackBombCase();
    }

    function generateLoversCase(questionBudget, seed) {
      const random = rng(seed);
      for (let attempt = 0; attempt < 16000; attempt += 1) {
        const generatedPaths = buildRandomActorPaths(random);
        const pairs = findNeverMeetPairs(generatedPaths);
        if (pairs.length === 1 && hasEnoughDistractors('lovers', generatedPaths, pairs[0])) {
          return {
            paths: clonePaths(generatedPaths),
            solution: pairs[0],
            difficulty: expectedAlwaysAloneQuestions()
          };
        }
      }
      return fallbackLoversCase();
    }

    function generateVandalCase(questionBudget, seed) {
      const random = rng(seed);
      for (let attempt = 0; attempt < 20000; attempt += 1) {
        const generatedPaths = buildRandomActorPaths(random);
        const vandals = actors
          .map(actor => actor.id)
          .map(actorId => ({ actor: actorId, detail: getVandalDetail(generatedPaths[actorId]) }))
          .filter(item => item.detail);
        if (vandals.length === 1 && hasEnoughDistractors('vandal', generatedPaths, { actor: vandals[0].actor, ...vandals[0].detail })) {
          return {
            paths: clonePaths(generatedPaths),
            solution: { actor: vandals[0].actor, ...vandals[0].detail },
            difficulty: expectedAlwaysAloneQuestions()
          };
        }
      }
      return fallbackVandalCase();
    }

    function buildRandomActorPaths(random) {
      const generatedPaths = {};
      actors.forEach(actor => {
        const startPlace = pick(places, random);
        generatedPaths[actor.id] = pick(buildPathsFrom(startPlace, times.length), random);
      });
      return generatedPaths;
    }

    function findBombEvents(generatedPaths) {
      const events = [];
      for (let timeIndex = 0; timeIndex < times.length - 1; timeIndex += 1) {
        places.forEach(place => {
          const here = actors.filter(actor => generatedPaths[actor.id][timeIndex] === place);
          if (here.length !== 2) return;
          const males = here.filter(actor => actor.gender === '男');
          const females = here.filter(actor => actor.gender === '女');
          if (males.length !== 1 || females.length !== 1) return;
          const victims = actors
            .map(actor => actor.id)
            .filter(actorId => generatedPaths[actorId][times.length - 1] === place);
          if (victims.length !== 1) return;
          events.push({
            place,
            victim: victims[0],
            male: males[0].id,
            female: females[0].id,
            timeIndex
          });
        });
      }
      return events;
    }

    function findNeverMeetPairs(generatedPaths) {
      const males = actors.filter(actor => actor.gender === '男');
      const females = actors.filter(actor => actor.gender === '女');
      const pairs = [];
      males.forEach(male => {
        females.forEach(female => {
          const neverMeet = times.every((time, timeIndex) => generatedPaths[male.id][timeIndex] !== generatedPaths[female.id][timeIndex]);
          if (neverMeet) pairs.push({ male: male.id, female: female.id });
        });
      });
      return pairs;
    }

    function getVandalDetail(path) {
      const uniquePlaces = new Set(path);
      if (uniquePlaces.size !== 5) return null;
      const repeated = places
        .map(place => ({ place, indexes: path.map((p, index) => p === place ? index : -1).filter(index => index >= 0) }))
        .filter(item => item.indexes.length === 2);
      if (repeated.length !== 1) return null;
      return { place: repeated[0].place, timeIndex: repeated[0].indexes[1] };
    }

    function hasEnoughDistractors(scriptId, generatedPaths, candidateSolution) {
      if (scriptId === 'theft') {
        return candidateSolution.timeIndex >= 2;
      }
      if (scriptId === 'loner') {
        return openingSingletonActors(generatedPaths).length >= 5;
      }
      if (scriptId === 'companion') {
        return openingGroupedActors(generatedPaths).length >= 5;
      }
      if (scriptId === 'jewel') {
        return candidateSolution.transfers.length >= 2
          && candidateSolution.pickupActor !== candidateSolution.actor
          && countFinalRoomOccupants(generatedPaths, candidateSolution.place) >= 2;
      }
      if (scriptId === 'bomb') {
        return candidateSolution.timeIndex >= 1
          && openingBombRoomsAreDistracting(generatedPaths)
          && countRoomsWithFinalVictims(generatedPaths).length >= 2;
      }
      if (scriptId === 'lovers') {
        return openingPackedActors(generatedPaths).length >= 5
          && openingOccupiedRooms(generatedPaths).length <= 3;
      }
      if (scriptId === 'vandal') {
        return actors.filter(actor => new Set(generatedPaths[actor.id]).size >= 4).length >= 4
          && actors.filter(actor => new Set(generatedPaths[actor.id]).size === 6).length >= 1
          && candidateSolution.timeIndex >= 2;
      }
      return true;
    }

    function openingPlaceCounts(generatedPaths) {
      const counts = {};
      places.forEach(place => counts[place] = 0);
      actors.forEach(actor => counts[generatedPaths[actor.id][0]] += 1);
      return counts;
    }

    function openingSingletonActors(generatedPaths) {
      const counts = openingPlaceCounts(generatedPaths);
      return actors.map(actor => actor.id).filter(actorId => counts[generatedPaths[actorId][0]] === 1);
    }

    function openingGroupedActors(generatedPaths) {
      const counts = openingPlaceCounts(generatedPaths);
      return actors.map(actor => actor.id).filter(actorId => counts[generatedPaths[actorId][0]] >= 2);
    }

    function openingOccupiedRooms(generatedPaths) {
      return places
        .map(place => ({
          place,
          actors: actors.filter(actor => generatedPaths[actor.id][0] === place)
        }))
        .filter(room => room.actors.length > 0);
    }

    function openingBombRoomsAreDistracting(generatedPaths) {
      return openingOccupiedRooms(generatedPaths).every(room => {
        if (room.actors.length === 1 || room.actors.length === 3) return true;
        if (room.actors.length === 2) {
          return room.actors[0].gender === room.actors[1].gender;
        }
        return false;
      });
    }

    function openingPackedActors(generatedPaths) {
      const counts = openingPlaceCounts(generatedPaths);
      return actors.map(actor => actor.id).filter(actorId => counts[generatedPaths[actorId][0]] >= 2);
    }

    function countFinalRoomOccupants(generatedPaths, place) {
      return actors.filter(actor => generatedPaths[actor.id][times.length - 1] === place).length;
    }

    function countRoomsWithFinalVictims(generatedPaths) {
      return places.filter(place => countFinalRoomOccupants(generatedPaths, place) > 0);
    }

    function findTheftEvents(generatedPaths) {
      const events = [];
      times.forEach((time, timeIndex) => {
        const cPlace = generatedPaths.C[timeIndex];
        const here = actors.map(actor => actor.id).filter(actorId => generatedPaths[actorId][timeIndex] === cPlace);
        if (here.length === 2) {
          const actor = here.find(actorId => actorId !== 'C');
          if (actor) events.push({ actor, place: cPlace, timeIndex });
        }
      });
      return events;
    }

    function getAllPathPool() {
      if (allPathCache) return allPathCache;
      allPathCache = {};
      actors.forEach(actor => {
        allPathCache[actor.id] = buildPathsFrom(fixedInitial[actor.id], times.length);
      });
      return allPathCache;
    }

    function buildPathsFrom(startPlace, length) {
      const results = [];
      function walk(path) {
        if (path.length === length) {
          results.push(path.slice());
          return;
        }
        links[path[path.length - 1]].forEach(nextPlace => walk(path.concat(nextPlace)));
      }
      walk([startPlace]);
      return results;
    }

    function pick(items, random) {
      return items[Math.floor(random() * items.length)];
    }

    function clonePaths(source) {
      const cloned = {};
      Object.keys(source).forEach(actorId => {
        cloned[actorId] = source[actorId].slice();
      });
      return cloned;
    }

    function fallbackLoversCase() {
      const fallbackPaths = {
        A: ['N1', 'N2', 'N6', 'N3', 'N6', 'N3'],
        B: ['N1', 'N2', 'N5', 'N1', 'N2', 'N5'],
        C: ['N1', 'N2', 'N1', 'N5', 'N1', 'N5'],
        D: ['N4', 'N5', 'N4', 'N1', 'N2', 'N3'],
        E: ['N4', 'N1', 'N4', 'N5', 'N2', 'N3'],
        F: ['N6', 'N2', 'N3', 'N2', 'N3', 'N6']
      };
      const pairs = findNeverMeetPairs(fallbackPaths);
      return {
        paths: fallbackPaths,
        solution: pairs[0] ?? { male: 'A', female: 'D' },
        difficulty: expectedAlwaysAloneQuestions()
      };
    }

    function fallbackVandalCase() {
      const fallbackPaths = {
        A: ['N1', 'N2', 'N3', 'N4', 'N5', 'N4'],
        B: ['N2', 'N1', 'N3', 'N2', 'N1', 'N2'],
        C: ['N3', 'N1', 'N2', 'N3', 'N1', 'N3'],
        D: ['N4', 'N5', 'N6', 'N4', 'N6', 'N4'],
        E: ['N5', 'N6', 'N4', 'N5', 'N6', 'N5'],
        F: ['N6', 'N5', 'N4', 'N6', 'N5', 'N6']
      };
      const detail = getVandalDetail(fallbackPaths.A);
      return {
        paths: fallbackPaths,
        solution: { actor: 'A', ...detail },
        difficulty: expectedAlwaysAloneQuestions()
      };
    }

    function pickInitialKnown(generatedPaths, count, random = Math.random) {
      const known = {};
      const selected = pickNonRevealingInitialActors(generatedPaths, count, random);
      selected.forEach(actor => {
        known[actor.id] = generatedPaths[actor.id][0];
      });
      return known;
    }

    function pickNonRevealingInitialActors(generatedPaths, count, random) {
      const allActors = actors.slice();
      const combos = combinations(allActors, count);
      const safeCombos = combos.filter(combo => {
        const placesSeen = new Set();
        return combo.every(actor => {
          const place = generatedPaths[actor.id][0];
          if (placesSeen.has(place)) return false;
          placesSeen.add(place);
          return true;
        });
      });
      const pool = safeCombos.length ? safeCombos : combos;
      return pool[Math.floor(random() * pool.length)];
    }

    function combinations(items, count) {
      const result = [];
      function walk(start, combo) {
        if (combo.length === count) {
          result.push(combo.slice());
          return;
        }
        for (let index = start; index < items.length; index += 1) {
          combo.push(items[index]);
          walk(index + 1, combo);
          combo.pop();
        }
      }
      walk(0, []);
      return result;
    }

    function isAlwaysAlone(generatedPaths, actorId) {
      for (const timeIndex of eventTimeIndexes) {
        const place = generatedPaths[actorId][timeIndex];
        const count = actors.filter(actor => generatedPaths[actor.id][timeIndex] === place).length;
        if (count !== 1) return false;
      }
      return true;
    }

    function isAlwaysWithSomeone(generatedPaths, actorId) {
      for (const timeIndex of eventTimeIndexes) {
        const place = generatedPaths[actorId][timeIndex];
        const count = actors.filter(actor => generatedPaths[actor.id][timeIndex] === place).length;
        if (count < 2) return false;
      }
      return true;
    }
