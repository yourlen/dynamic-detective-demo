    function evaluateExpectedQuestions() {
      const initialExpected = currentScriptId === 'theft' ? expectedTheftQuestions() : expectedAlwaysAloneQuestions();
      const used = maxQuestions - questionLeft;
      const remainingExpected = currentScriptId === 'theft' ? Math.max(0, initialExpected - used) : estimateRemainingAlwaysAlone();
      const elimination = analyzeCurrentEliminationSpace();
      return {
        initialExpected,
        remainingExpected,
        totalExpectedFromNow: used + remainingExpected,
        candidateText: `${elimination.candidateCount} 个${elimination.limited ? '+' : ''}；${describeCandidateProgress()}`,
        stateText: elimination.stateCounts?.map((count, index) => `${times[index]}:${count}`).join(' / ') || '-',
      };
    }

    function analyzeCurrentEliminationSpace() {
      const setting = scriptSettings[currentScriptId]?.source === 'config'
        ? scriptSettings[currentScriptId]
        : {
          conditionType: currentScriptId === 'jewel' ? 'jewelTransfer'
            : currentScriptId === 'bomb' ? 'bomb'
            : currentScriptId === 'lovers' ? 'neverMeetPair'
            : currentScriptId === 'vandal' ? 'visitCount'
            : currentScriptId === 'companion' ? 'alwaysTogether'
            : currentScriptId === 'theft' ? 'theft'
            : 'alwaysAlone',
          conditionParams: currentScriptId === 'theft' ? { targetActor: 'C' } : {},
          initialKnown
        };
      return analyzeEliminationSpace(setting, { limit: 5000 });
    }

    function hasEnoughEliminationSpace(setting, solutionResult) {
      const stats = setting._initialEliminationStats ?? analyzeEliminationSpace(setting, { includeConfirmed: false });
      setting._initialEliminationStats = stats;
      const minCandidates = Number(setting.conditionParams?.minCandidates || setting.conditionParams?.最少候选 || 4);
      if (stats.candidateCount < minCandidates) return false;
      if (isSolutionObviousFromInitialKnown(setting, solutionResult)) return false;
      return stats.candidates.has(solutionKey(setting.conditionType, solutionResult));
    }

    function isSolutionObviousFromInitialKnown(setting, solutionResult) {
      if (!solutionResult) return false;
      const knownActorIds = Object.keys(setting.initialKnown || {});
      if (knownActorIds.length < actors.length) return false;
      const state = {};
      actors.forEach(actor => {
        state[actor.id] = setting.initialKnown?.[actor.id];
      });
      if (actors.some(actor => !state[actor.id])) return false;

      if (setting.conditionType === 'theft' && solutionResult.timeIndex === 0) {
        const targetActor = setting.conditionParams?.targetActor || 'C';
        const targetPlace = state[targetActor];
        const here = actors.map(actor => actor.id).filter(actorId => state[actorId] === targetPlace);
        if (here.length !== 2) return false;
        const actor = here.find(actorId => actorId !== targetActor);
        return solutionKey('theft', { actor, place: targetPlace, timeIndex: 0 }) === solutionKey('theft', solutionResult);
      }

      return false;
    }

    function analyzeEliminationSpace(setting, options = {}) {
      const statesByTime = times.map((time, timeIndex) => enumerateStatesForTime(setting, timeIndex, options));
      const candidates = new Set();
      const add = key => candidates.add(key);
      const type = setting.conditionType;
      const params = setting.conditionParams || {};
      const targetActor = params.targetActor || 'C';

      if (type === 'theft') {
        statesByTime.forEach((states, timeIndex) => {
          states.forEach(state => {
            const place = state[targetActor];
            const here = actors.map(actor => actor.id).filter(actorId => state[actorId] === place);
            if (here.length !== 2) return;
            const actor = here.find(actorId => actorId !== targetActor);
            if (actor) add(solutionKey(type, { actor, place, timeIndex }));
          });
        });
      } else if (type === 'alwaysAlone') {
        actors.forEach(actor => {
          const possible = eventTimeIndexes.every(timeIndex => {
            return statesByTime[timeIndex].some(state => stateCountAtPlace(state, state[actor.id]) === 1);
          });
          if (possible) add(solutionKey(type, { actor: actor.id }));
        });
      } else if (type === 'alwaysTogether') {
        actors.forEach(actor => {
          const possible = eventTimeIndexes.every(timeIndex => {
            return statesByTime[timeIndex].some(state => stateCountAtPlace(state, state[actor.id]) >= 2);
          });
          if (possible) add(solutionKey(type, { actor: actor.id }));
        });
      } else if (type === 'neverMeetPair') {
        const males = actors.filter(actor => isMale(actor));
        const females = actors.filter(actor => isFemale(actor));
        males.forEach(male => {
          females.forEach(female => {
            const possible = times.every((time, timeIndex) => {
              return statesByTime[timeIndex].some(state => state[male.id] !== state[female.id]);
            });
            if (possible) add(solutionKey(type, { male: male.id, female: female.id }));
          });
        });
      } else if (type === 'visitCount') {
        const uniqueCount = Number(params.uniqueCount || 5);
        const repeatedCount = Number(params.repeatedCount || 2);
        actors.forEach(actor => {
          enumerateActorStatePaths(statesByTime, actor.id).forEach(path => {
            const detail = getVisitDetail(path, uniqueCount, repeatedCount);
            if (detail) add(solutionKey(type, { actor: actor.id, ...detail }));
          });
        });
      } else if (type === 'bomb') {
        for (let timeIndex = 0; timeIndex < times.length - 1; timeIndex += 1) {
          statesByTime[timeIndex].forEach(installState => {
            places.forEach(place => {
              const here = actors.filter(actor => installState[actor.id] === place);
              if (here.length !== 2) return;
              const males = here.filter(actor => isMale(actor));
              const females = here.filter(actor => isFemale(actor));
              if (males.length !== 1 || females.length !== 1) return;
              statesByTime[times.length - 1].forEach(finalState => {
                const victims = actors.filter(actor => finalState[actor.id] === place);
                if (victims.length !== 1) return;
                add(solutionKey(type, { place, victim: victims[0].id, male: males[0].id, female: females[0].id }));
              });
            });
          });
        }
      } else if (type === 'jewelTransfer') {
        statesByTime[times.length - 1].forEach(state => {
          actors.forEach(actor => add(solutionKey(type, { actor: actor.id, place: state[actor.id] })));
        });
      }

      return {
        candidateCount: candidates.size,
        candidates,
        limited: false,
        stateCounts: statesByTime.map(states => states.length)
      };
    }

    function enumerateStatesForTime(setting, timeIndex, options = {}) {
      const constraints = {};
      if (timeIndex === 0) {
        Object.assign(constraints, setting.initialKnown || {});
      }
      if (options.includeConfirmed !== false) {
        Object.keys(confirmed).forEach(rawKey => {
          const [knownTimeIndex, place, actorId] = rawKey.split('|');
          if (!actorId || Number(knownTimeIndex) !== timeIndex || !confirmed[rawKey]) return;
          constraints[actorId] = place;
        });
      }
      const states = [];
      function walk(actorIndex, state) {
        if (actorIndex >= actors.length) {
          states.push({ ...state });
          return;
        }
        const actorId = actors[actorIndex].id;
        const fixedPlace = constraints[actorId];
        const pool = fixedPlace ? [fixedPlace] : places;
        pool.forEach(place => {
          state[actorId] = place;
          walk(actorIndex + 1, state);
        });
        delete state[actorId];
      }
      walk(0, {});
      return states;
    }

    function stateCountAtPlace(state, place) {
      return actors.filter(actor => state[actor.id] === place).length;
    }

    function enumerateActorStatePaths(statesByTime, actorId) {
      const optionsByTime = statesByTime.map(states => Array.from(new Set(states.map(state => state[actorId]))));
      const paths = [];
      function walk(timeIndex, path) {
        if (timeIndex >= times.length) {
          paths.push(path.slice());
          return;
        }
        optionsByTime[timeIndex].forEach(place => {
          path.push(place);
          walk(timeIndex + 1, path);
          path.pop();
        });
      }
      walk(0, []);
      return paths;
    }

    function isMale(actor) {
      return actor.gender === '男' || String(actor.gender).includes('男');
    }

    function isFemale(actor) {
      return actor.gender === '女' || String(actor.gender).includes('女');
    }

    function solutionKey(type, item) {
      if (!item) return '';
      if (type === 'theft') return `${item.actor}|${item.place}|${item.timeIndex}`;
      if (type === 'alwaysAlone' || type === 'alwaysTogether') return item.actor;
      if (type === 'jewelTransfer') return `${item.actor}|${item.place}`;
      if (type === 'bomb') return `${item.place}|${item.victim}|${item.male}|${item.female}`;
      if (type === 'neverMeetPair') return `${item.male}|${item.female}`;
      if (type === 'visitCount') return `${item.actor}|${item.place}|${item.timeIndex}`;
      return JSON.stringify(item);
    }

    function expectedAlwaysAloneQuestions() {
      return averagePosition(actors.length) * averagePosition(eventTimeIndexes.length);
    }

    function expectedTheftQuestions() {
      return averagePosition(times.length) + averagePosition(actors.length - 1);
    }

    function estimateRemainingAlwaysAlone() {
      let total = 0;
      actors.forEach(actor => {
        const asked = askedActorTimes[actor.id]?.size ?? 0;
        if (actor.id === solution.actor) {
          total += Math.max(0, times.length - asked);
        } else if (asked === 0) {
          total += 2;
        } else if (!hasDisqualifiedActor(actor.id)) {
          total += 1.5;
        }
      });
      return Math.max(0, total / 2);
    }

    function hasDisqualifiedActor(actorId) {
      const asked = askedActorTimes[actorId];
      if (!asked) return false;
      return Array.from(asked).some(timeIndex => {
        if (!eventTimeIndexes.includes(timeIndex)) return false;
        const place = paths[actorId][timeIndex];
        const count = actors.filter(actor => paths[actor.id][timeIndex] === place).length;
        return currentScriptId === 'companion' ? count < 2 : count !== 1;
      });
    }

    function describeCandidateProgress() {
      const active = actors
        .map(actor => actor.id)
        .filter(actorId => !hasDisqualifiedActor(actorId));
      const label = currentScriptId === 'companion' ? '仍可能始终同房' : '未排除';
      return `${label} ${active.length} 人：${active.join('/')}`;
    }

    function averagePosition(count) {
      if (count <= 0) return 0;
      return (count + 1) / 2;
    }

    function submitAnswer() {
      const actor = document.getElementById('answerActor').value;
      const correct = scriptSettings[currentScriptId]?.source === 'config'
        ? isConfiguredAnswerCorrect(scriptSettings[currentScriptId])
        : currentScriptId === 'theft'
        ? actor === solution.actor
          && document.getElementById('answerPlace').value === solution.place
          && Number(document.getElementById('answerTime').value) === solution.timeIndex
        : currentScriptId === 'jewel'
          ? actor === solution.actor && document.getElementById('answerPlace').value === solution.place
        : currentScriptId === 'bomb'
          ? actor === solution.victim
            && document.getElementById('answerPlace').value === solution.place
            && document.getElementById('answerActor2').value === solution.male
            && document.getElementById('answerActor3').value === solution.female
        : currentScriptId === 'lovers'
          ? actor === solution.male && document.getElementById('answerActor2').value === solution.female
        : currentScriptId === 'vandal'
          ? actor === solution.actor
            && document.getElementById('answerPlace').value === solution.place
            && Number(document.getElementById('answerTime').value) === solution.timeIndex
          : actor === solution.actor;
      const truth = scriptSettings[currentScriptId]?.source === 'config'
        ? configuredTruthText(scriptSettings[currentScriptId])
        : currentScriptId === 'theft'
        ? `正确答案：${solution.actor} 在 ${times[solution.timeIndex]} 于 ${solution.place} 偷走了 C 的物品。`
        : currentScriptId === 'jewel'
          ? `正确答案：19:50 时珠宝在 ${solution.actor} 身上，${solution.actor} 位于 ${solution.place}。珠宝房间是 ${solution.jewelRoom}。`
        : currentScriptId === 'bomb'
          ? `正确答案：爆炸地点是 ${solution.place}，${solution.victim} 被炸死。安装炸弹的人是 ${solution.male} 和 ${solution.female}。`
        : currentScriptId === 'lovers'
          ? `正确答案：${solution.male} 和 ${solution.female} 从未在同一时间出现在同一地点。`
        : currentScriptId === 'vandal'
          ? `正确答案：罪犯是 ${solution.actor}，重复到访 ${solution.place}，第二次到达时间是 ${times[solution.timeIndex]}。`
        : currentScriptId === 'companion'
          ? `正确答案：${solution.actor}。${solution.actor} 是唯一一名所有时间都与别人待在同一房间里的角色。`
          : `正确答案：${solution.actor}。${solution.actor} 是唯一一名所有时间都单独待在房间里的角色。`;
      let staminaText = '';
      if (!caseResolved) {
        caseResolved = true;
        if (!correct) spendStaminaOnFailure();
      }
      if (!correct) staminaText = `<div>失败扣除 1 点体力，当前体力 ${staminaState.value}/${staminaMax}。</div>`;
      document.getElementById('answerResult').innerHTML = `
        <div class="result-title">${correct ? '成功' : '失败'}</div>
        <div>${correct ? `剩余询问次数 ${questionLeft}/${maxQuestions}。` : truth}</div>
        ${staminaText}
      `;
      document.getElementById('reviewPanel').innerHTML = renderReviewRoutes(!correct || ['companion', 'jewel', 'bomb', 'lovers', 'vandal'].includes(currentScriptId));
      document.getElementById('closeResult').classList.remove('hidden');
    }

    function isConfiguredAnswerCorrect(setting) {
      const actor = document.getElementById('answerActor').value;
      const place = document.getElementById('answerPlace').value;
      const timeIndex = Number(document.getElementById('answerTime').value);
      const actor2 = document.getElementById('answerActor2').value;
      const actor3 = document.getElementById('answerActor3').value;
      if (setting.conditionType === 'theft') return actor === solution.actor && place === solution.place && timeIndex === solution.timeIndex;
      if (setting.conditionType === 'jewelTransfer') return actor === solution.actor && place === solution.place;
      if (setting.conditionType === 'bomb') return actor === solution.victim && place === solution.place && actor2 === solution.male && actor3 === solution.female;
      if (setting.conditionType === 'neverMeetPair') return actor === solution.male && actor2 === solution.female;
      if (setting.conditionType === 'visitCount') return actor === solution.actor && place === solution.place && timeIndex === solution.timeIndex;
      return actor === solution.actor;
    }

    function configuredTruthText(setting) {
      if (setting.conditionType === 'theft') return `正确答案：${solution.actor} 在 ${times[solution.timeIndex]} 于 ${solution.place} 下手。`;
      if (setting.conditionType === 'jewelTransfer') return `正确答案：19:50 时目标在 ${solution.actor} 身上，${solution.actor} 位于 ${solution.place}。`;
      if (setting.conditionType === 'bomb') return `正确答案：地点 ${solution.place}，遇害者 ${solution.victim}，安装者 ${solution.male} 和 ${solution.female}。`;
      if (setting.conditionType === 'neverMeetPair') return `正确答案：${solution.male} 和 ${solution.female} 从未同处。`;
      if (setting.conditionType === 'visitCount') return `正确答案：${solution.actor}，重复地点 ${solution.place}，第二次时间 ${times[solution.timeIndex]}。`;
      return `正确答案：${solution.actor}。`;
    }

    function describeSolution() {
      if (currentScriptId === 'theft') return `${solution.actor} / ${solution.place} / ${times[solution.timeIndex]}`;
      if (currentScriptId === 'jewel') return `${solution.actor} / ${solution.place}`;
      if (currentScriptId === 'bomb') return `${solution.place} / ${solution.victim} / ${solution.male}+${solution.female}`;
      if (currentScriptId === 'lovers') return `${solution.male}+${solution.female}`;
      if (currentScriptId === 'vandal') return `${solution.actor} / ${solution.place} / ${times[solution.timeIndex]}`;
      return solution.actor;
    }

    function renderReviewRoutes(highlightAnswer) {
      const rows = actors.map(actor => {
        const steps = times.map((time, timeIndex) => {
          const place = paths[actor.id][timeIndex];
          const isHit = highlightAnswer && isAnswerStep(actor.id, place, timeIndex);
          return `<span class="route-step ${isHit ? 'route-hit' : ''}">${place}</span>`;
        }).join('<span class="route-arrow">→</span>');
        return `
          <div class="route-row">
            <div class="route-actor">${actor.id}</div>
            <div class="route-line">${steps}</div>
          </div>`;
      }).join('');
      return `<div class="route-review">${rows}</div>`;
    }

    function isAnswerStep(actorId, place, timeIndex) {
      if (currentScriptId === 'theft') {
        return actorId === solution.actor && place === solution.place && timeIndex === solution.timeIndex;
      }
      if (currentScriptId === 'jewel') {
        return actorId === solution.actor;
      }
      if (currentScriptId === 'bomb') {
        return actorId === solution.victim || actorId === solution.male || actorId === solution.female;
      }
      if (currentScriptId === 'lovers') {
        return actorId === solution.male || actorId === solution.female;
      }
      if (currentScriptId === 'vandal') {
        return actorId === solution.actor;
      }
      return actorId === solution.actor;
    }

    function renderReviewRoomLayer(timeIndex, place, highlightAnswer) {
      const rect = roomRects[place];
      const here = actors
        .map(actor => actor.id)
        .filter(actorId => paths[actorId][timeIndex] === place);
      const highlight = highlightAnswer && here.includes(solution.actor);
      const style = `left:${rect.x / 850 * 100}%;top:${rect.y / 104 * 100}%;width:${rect.w / 850 * 100}%;height:${rect.h / 104 * 100}%;`;
      return `<div class="review-room-layer ${highlight ? 'review-answer' : ''}" style="${style}"><div class="mark-zone">${here.join(' ')}</div></div>`;
    }

    function addHistory(text) { history.push(text); }
    function pushLog(text) { document.getElementById('log').textContent = text; }
    function key(timeIndex, place, actorId = '') { return `${timeIndex}|${place}|${actorId}`; }
    function cellKey(timeIndex, place) { return `${timeIndex}|${place}`; }
    function returnToMenu() {
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('mainScreen').classList.add('hidden');
      document.getElementById('menuScreen').classList.remove('hidden');
      document.getElementById('globalStamina').classList.remove('hidden');
      refreshStamina();
    }
    function highlightHint() {
      const card = document.querySelector('.hint-card');
      card.classList.remove('attention');
      void card.offsetWidth;
      card.classList.add('attention');
    }

    document.getElementById('askTime').onclick = askTime;
    document.getElementById('askPlace').onclick = askPlace;
    document.getElementById('queryBtn').onclick = () => document.getElementById('queryOverlay').style.display = 'grid';
    document.getElementById('closeQuery').onclick = () => document.getElementById('queryOverlay').style.display = 'none';
    document.getElementById('historyBtn').onclick = showHistory;
    document.getElementById('answerBtn').onclick = showAnswer;
    document.getElementById('devBtn').onclick = showDevPanel;
    document.getElementById('refreshDev').onclick = renderDevStats;
    document.getElementById('closeDev').onclick = () => document.getElementById('devOverlay').style.display = 'none';
    document.getElementById('closeMark').onclick = () => document.getElementById('markOverlay').style.display = 'none';
    document.getElementById('clearCell').onclick = clearActiveCell;
    document.getElementById('markUnknown').onclick = toggleActiveUnknown;
    document.getElementById('closeHistory').onclick = closeHistory;
    document.getElementById('closeAnswer').onclick = () => document.getElementById('answerOverlay').style.display = 'none';
    document.getElementById('closeResult').onclick = () => document.getElementById('answerOverlay').style.display = 'none';
    document.getElementById('submitAnswer').onclick = submitAnswer;
    document.getElementById('newCase').onclick = () => { caseSeed = Date.now(); startRound(); };
    document.getElementById('resetBtn').onclick = () => { caseSeed = Date.now(); startRound(); };
    document.getElementById('backBtn').onclick = returnToMenu;
    document.getElementById('backToMainBtn').onclick = showMainScreen;
    document.querySelectorAll('[data-difficulty]').forEach(button => {
      button.onclick = () => showDifficultyList(button.dataset.difficulty);
    });
    document.querySelectorAll('[data-script]').forEach(button => {
      button.onclick = () => enterScript(button.dataset.script);
    });
    document.querySelectorAll('[data-known]').forEach(button => {
      button.onclick = () => {
        knownInitialCount = Number(button.dataset.known);
        caseSeed = Date.now();
        startRound();
      };
    });
    refreshStamina();
    setInterval(refreshStamina, 1000);
    setTimeout(async () => {
      await loadAutoLevelConfig();
      showMainScreen();
    }, 900);
  </script>
</body>
